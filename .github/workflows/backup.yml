name: Nightly backup
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export items from the live app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl -fsS --retry 5 --retry-delay 30 --max-time 120 "$APP_URL/api/export" -o items.json
          test "$(head -c1 items.json)" = "["
      - uses: actions/upload-artifact@v4
        with:
          name: ffis-presents-backup-${{ github.run_id }}
          path: items.json
          retention-days: 90
