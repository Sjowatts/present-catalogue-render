# Fly.io settings. Region "lhr" is London, so shops see a UK visitor and show prices in pounds.
# Change "app" to a name nobody else has taken, for example ffis-presents-yourname.
app = "ffis-presents"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "10s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
