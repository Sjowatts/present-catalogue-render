<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ffi's Presents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ribbon" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M12 8v13M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/><path d="M12 8C10.5 4 6 4 6 6.5S9 8 12 8Zm0 0c1.5-4 6-4 6-1.5S15 8 12 8Z"/></svg>
      </span>
      <h1>Ffi's Presents</h1>
    </div>
    <div class="topbar-actions">
      <a href="/api/export" download style="text-decoration:none"><button type="button" class="btn">Export</button></a>
      <button type="button" class="btn" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <main>
    <nav class="lists" id="lists" aria-label="Lists"></nav>

    <section class="add">
      <label for="url" class="eyebrow" id="addLabel">Add a present</label>
      <div class="add-row">
        <div class="field">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b9acd6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
          <input type="url" id="url" placeholder="Paste a product link" autocomplete="off">
        </div>
        <button type="button" class="btn-primary" id="add">Add</button>
        <button type="button" class="btn btn-secondary" id="refreshAll">Refresh prices</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="panel" hidden></section>

    <section class="toolbar">
      <div class="tabs" role="group" aria-label="Filter presents">
        <button type="button" class="tab" data-filter="all" aria-pressed="true">All <span class="n" id="n-all">0</span></button>
        <button type="button" class="tab" data-filter="todo" aria-pressed="false">Still to buy <span class="n" id="n-todo">0</span></button>
        <button type="button" class="tab" data-filter="bought" aria-pressed="false">Bought <span class="n" id="n-bought">0</span></button>
        <button type="button" class="tab" data-filter="fav" aria-pressed="false">Favourites <span class="n" id="n-fav">0</span></button>
        <button type="button" class="tab" data-filter="drop" aria-pressed="false">Price drops <span class="n" id="n-drop">0</span></button>
      </div>
      <div class="tools">
        <label for="search" class="sr-only">Search presents</label>
        <input type="search" id="search" class="search" placeholder="Search presents">
        <label for="sort" class="sr-only">Sort presents</label>
        <select id="sort" class="select">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="drop">Biggest price drop</option>
          <option value="az">Name A to Z</option>
        </select>
      </div>
    </section>

    <section id="list" class="grid"></section>
  </main>

  <dialog id="listDialog" aria-labelledby="listDialogTitle">
    <form method="dialog" class="dlg" id="listForm">
      <h2 id="listDialogTitle">New list</h2>
      <label>Name <input id="listName" required maxlength="60" placeholder="e.g. Mum, Christmas, Birthdays"></label>
      <div class="row">
        <label>Budget (optional) <input id="listBudget" type="number" min="0" step="0.01" inputmode="decimal" placeholder="100"></label>
        <label>Currency
          <select id="listCurrency"><option>GBP</option><option>USD</option><option>EUR</option></select>
        </label>
      </div>
      <div class="dlg-actions">
        <button type="button" class="btn" id="listCancel">Cancel</button>
        <button type="submit" class="btn btn-violet">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="shareDialog" aria-labelledby="shareTitle">
    <div class="dlg">
      <h2 id="shareTitle">Share this list</h2>
      <div id="shareBody"></div>
      <div class="dlg-actions"><button type="button" class="btn" id="shareClose">Close</button></div>
    </div>
  </dialog>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="/main.js"></script>
</body>
</html>
