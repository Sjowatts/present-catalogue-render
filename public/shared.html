<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Shared list · Ffi's Presents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ribbon" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M12 8v13M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/><path d="M12 8C10.5 4 6 4 6 6.5S9 8 12 8Zm0 0c1.5-4 6-4 6-1.5S15 8 12 8Z"/></svg>
      </span>
      <h1>Ffi's Presents</h1>
    </div>
  </header>
  <main>
    <section class="shared-hero">
      <h2 id="listName">Loading…</h2>
      <p id="intro"></p>
    </section>
    <section class="whoami" id="whoami" hidden>
      <label for="myName">Your name</label>
      <input id="myName" maxlength="40" placeholder="So everyone knows who is getting what" autocomplete="given-name">
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section id="list" class="grid"></section>
  </main>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="/shared.js"></script>
</body>
</html>
